<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dealflow AI Assistant</title>
  <style>
    :root {
      --bg-dark: #0f172a;
      --panel-bg: rgba(30, 41, 59, 0.85);
      --teal-primary: #14b8a6;
      --violet-accent: #7c3aed;
      --text-white: #f8fafc;
      --text-muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 340px;
      height: 480px;
      background-color: var(--bg-dark);
      color: var(--text-white);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 16px;
      overflow: hidden;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      margin-bottom: 16px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      font-size: 15px;
      letter-spacing: 0.05em;
    }
    .brand-accent { color: var(--teal-primary); }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 12px;
      background: rgba(20, 184, 166, 0.15);
      color: var(--teal-primary);
      border: 1px solid rgba(20, 184, 166, 0.3);
    }
    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background-color: var(--teal-primary);
    }
    .card {
      background: var(--panel-bg);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 12px;
      backdrop-filter: blur(12px);
    }
    .card-title {
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      margin-bottom: 8px;
    }
    .btn {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: none;
      background: linear-gradient(135deg, var(--teal-primary), var(--violet-accent));
      color: #fff;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      transition: opacity 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .btn:hover { opacity: 0.9; }
    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .stat-box {
      background: rgba(255, 255, 255, 0.04);
      padding: 10px;
      border-radius: 8px;
      text-align: center;
    }
    .stat-val { font-size: 18px; font-weight: 700; color: var(--teal-primary); }
    .stat-lbl { font-size: 10px; color: var(--text-muted); }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <span>DEALFLOW<span class="brand-accent">.AI</span></span>
    </div>
    <div class="status-badge">
      <span class="dot"></span>
      <span id="status-text">Active</span>
    </div>
  </div>

  <div class="card">
    <div class="card-title">Quick Lead Scraper</div>
    <p style="font-size: 12px; color: var(--text-muted); margin-bottom: 12px;">Extract lead context from active browser tab and sync to Dealflow workspace.</p>
    <button class="btn" id="sync-current-tab">
      <span>⚡ Sync Active Tab</span>
    </button>
  </div>

  <div class="card">
    <div class="card-title">Today's Revenue Intelligence</div>
    <div class="stats-grid">
      <div class="stat-box">
        <div class="stat-val" id="leads-count">28</div>
        <div class="stat-lbl">Leads Scored</div>
      </div>
      <div class="stat-box">
        <div class="stat-val" id="growth-rate">3.2x</div>
        <div class="stat-lbl">Pipeline Growth</div>
      </div>
    </div>
  </div>

  <div class="card" style="margin-bottom: 0;">
    <div class="card-title">Shortcuts</div>
    <div style="display: flex; gap: 8px;">
      <button class="btn" style="background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.1); font-size: 11px;" id="btn-open-agent">Agent Portal</button>
      <button class="btn" style="background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.1); font-size: 11px;" id="btn-open-customer">Customer Portal</button>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
