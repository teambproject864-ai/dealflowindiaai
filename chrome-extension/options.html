<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dealflow AI - Extension Options</title>
  <style>
    body {
      background-color: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 32px;
      max-width: 600px;
      margin: 0 auto;
    }
    h1 { font-size: 20px; font-weight: 700; margin-bottom: 24px; color: #14b8a6; }
    .form-group { margin-bottom: 16px; }
    label { display: block; font-size: 12px; font-weight: 600; text-transform: uppercase; color: #94a3b8; margin-bottom: 6px; }
    input[type="text"] {
      width: 100%;
      padding: 10px 14px;
      background: #1e293b;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      color: #fff;
      font-size: 14px;
      outline: none;
    }
    .save-btn {
      padding: 10px 20px;
      background: linear-gradient(135deg, #14b8a6, #7c3aed);
      border: none;
      border-radius: 8px;
      color: #fff;
      font-weight: 600;
      cursor: pointer;
    }
    #status-msg { margin-top: 12px; font-size: 13px; color: #34d399; }
  </style>
</head>
<body>
  <h1>Dealflow AI Extension Settings</h1>
  <div class="form-group">
    <label for="serverUrl">Dealflow Platform Host URL</label>
    <input type="text" id="serverUrl" placeholder="http://localhost:3000 or https://dealsflowai.vercel.app">
  </div>
  <div class="form-group">
    <label for="apiToken">API Bearer / JWT Token</label>
    <input type="text" id="apiToken" placeholder="Paste your Dealflow token">
  </div>
  <button class="save-btn" id="save-settings">Save Settings</button>
  <div id="status-msg"></div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      chrome.storage.sync.get(["serverUrl", "apiToken"], (data) => {
        if (data.serverUrl) document.getElementById("serverUrl").value = data.serverUrl;
        if (data.apiToken) document.getElementById("apiToken").value = data.apiToken;
      });

      document.getElementById("save-settings").addEventListener("click", () => {
        const serverUrl = document.getElementById("serverUrl").value.trim();
        const apiToken = document.getElementById("apiToken").value.trim();
        chrome.storage.sync.set({ serverUrl, apiToken }, () => {
          const msg = document.getElementById("status-msg");
          msg.textContent = "Settings saved successfully!";
          setTimeout(() => { msg.textContent = ""; }, 3000);
        });
      });
    });
  </script>
</body>
</html>
