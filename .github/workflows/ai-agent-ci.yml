name: AI Agent & MAG CI/CD Regression Evaluation

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  agent-eval-job:
    name: Agent & MAG Evaluation Pipeline
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Execute Agent Unit & Integration Tests
        run: npm test

      - name: Enforce CI Threshold Evaluation
        run: npx tsx scripts/ci-agent-evaluation.ts
