[tool.pyrefly]
type-checking-mode = "off"
disable-type-errors = true
project-excludes = [
    "**/inmemory/**",
    "**/virtual/**",
    "**/__pyrefly_virtual__/**",
    "D:/__pyrefly_virtual__/**",
    "D:\\__pyrefly_virtual__\\**",
    "**/node_modules/**",
    "**/__pycache__/**"
]

[tool.pyrefly.errors]
parse-error = false
unknown-name = false
